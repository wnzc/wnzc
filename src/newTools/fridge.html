<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冰箱料理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
      min-height: 100vh;
      padding: 20px;
      color: #fff;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 14px;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: #ff9800;
    }

    .main-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.35);
    }

    .card-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .card-header .icon {
      font-size: 42px;
      margin-bottom: 6px;
    }

    .card-header h1 {
      font-size: 22px;
      color: #fff;
      font-weight: 600;
    }

    .card-header .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-top: 4px;
    }

    .field-label {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      margin: 18px 0 8px;
    }

    .field-label .optional {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .text-input {
      flex: 1;
      min-width: 0;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .text-input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .text-input:focus {
      border-color: rgba(255,152,0,0.7);
    }

    select.text-input {
      width: 100%;
      flex: none;
      cursor: pointer;
    }

    .add-btn {
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .add-btn:hover {
      box-shadow: 0 4px 12px rgba(255,152,0,0.4);
    }

    .add-btn:active {
      transform: translateY(1px);
    }

    .chip-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      min-height: 32px;
    }

    .chip-box .empty-tip {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      line-height: 30px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,152,0,0.16);
      border: 1px solid rgba(255,152,0,0.5);
      border-radius: 999px;
      padding: 4px 6px 4px 12px;
      font-size: 13px;
      color: #ffb74d;
    }

    .chip-x {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: rgba(255,152,0,0.28);
      color: #ffd699;
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-x:hover {
      background: #ff9800;
      color: #fff;
    }

    .hint {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      margin-top: 8px;
      line-height: 1.6;
    }

    .get-btn,
    .voice-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 50px;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .get-btn {
      margin-top: 20px;
      background: linear-gradient(135deg, #ff9800, #f57c00);
      box-shadow: 0 4px 15px rgba(255,152,0,0.35);
    }

    .get-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,152,0,0.45);
    }

    .get-btn:active {
      transform: translateY(0);
    }

    .get-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .voice-btn {
      margin-top: 12px;
      background: linear-gradient(135deg, #ef6c00, #fb8c00);
      box-shadow: 0 4px 15px rgba(239,108,0,0.3);
    }

    .voice-btn:hover {
      background: linear-gradient(135deg, #fb8c00, #ffa726);
    }

    .voice-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .hidden {
      opacity: 0.4;
      pointer-events: none;
    }

    .output-box {
      margin-top: 20px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 18px;
      min-height: 120px;
    }

    .output-box .output-text {
      font-size: 14px;
      line-height: 1.9;
      color: rgba(255,255,255,0.88);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .output-box .placeholder {
      color: rgba(255,255,255,0.35);
      font-size: 14px;
      text-align: center;
      padding: 40px 0;
    }

    .loading-dots {
      display: inline-block;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    .audio-section {
      margin-top: 12px;
      display: none;
    }

    .audio-section.show {
      display: block;
    }

    .audio-section audio {
      width: 100%;
      border-radius: 10px;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .main-card {
        padding: 20px 16px;
      }
      .card-header h1 {
        font-size: 19px;
      }
      .add-btn {
        padding: 0 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../../index.html" class="back-link">← 返回工具箱</a>

    <div class="main-card">
      <div class="card-header">
        <div class="icon">🧊</div>
        <h1>冰箱料理</h1>
        <div class="subtitle">冰箱里有什么，今晚就吃什么</div>
      </div>

      <div class="field-label">🥬 家里的食材</div>
      <div class="input-row">
        <input type="text" class="text-input" id="ingredientInput"
               placeholder="如：鸡蛋、西红柿 青椒" maxlength="30">
        <button class="add-btn" id="addBtn" onclick="addIngredients()">添加</button>
      </div>
      <div class="chip-box" id="chipBox"></div>
      <div class="hint">支持一次粘贴多个，逗号、顿号或空格分隔都会自动拆开，点 × 可删除</div>

      <div class="field-label">
        <label for="prefSelect">🌶️ 口味偏好</label>
      </div>
      <select class="text-input" id="prefSelect">
        <option value="随便" selected>随便</option>
        <option value="清淡">清淡</option>
        <option value="下饭">下饭</option>
        <option value="嗜辣">嗜辣</option>
        <option value="少油">少油</option>
      </select>

      <div class="field-label">
        <label for="tabooInput">🚫 忌口</label>
        <span class="optional">选填</span>
      </div>
      <input type="text" class="text-input" id="tabooInput"
             placeholder="如：不吃香菜、海鲜过敏" maxlength="50">

      <button class="get-btn" id="getBtn" onclick="fetchDishes()">
        🍳 看看做什么
      </button>

      <div class="output-box">
        <div class="output-text" id="outputText">
          <span class="placeholder">把食材加进来，帮你想想吃啥<br>推荐三道家常菜，附做法</span>
        </div>
      </div>

      <button class="voice-btn hidden" id="voiceBtn" onclick="generateVoice()">
        🔊 朗读菜谱
      </button>

      <div class="audio-section" id="audioSection">
        <audio id="audioEl" controls></audio>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../../ai-models.js"></script>
  <script src="../ai-config.js"></script>
  <script src="../ai-history.js"></script>
  <script>

    // ---------- 系统提示词 ----------
    var SYSTEM_PROMPT = '你是贴心接地气的家常菜助手。用户会给出家里现有的食材、口味偏好和忌口。请推荐三道现有食材基本能做的家常菜，每道按以下格式输出，两道菜之间空一行：\n【菜一】菜名\n推荐理由：一句话（结合现有食材与口味偏好）\n还需补充：缺少的基础调料或配菜；若齐了写「基本齐了」\n做法：编号步骤，总共不超过6步，简单可操作\n要求：家常、常见调料优先、杜绝猎奇食材；严格遵守忌口；语言简洁带生活气息。';

    var ingredients = [];   // 已添加的食材列表
    var currentDish = '';   // 当前生成的菜谱全文
    var currentAudioUrl = '';

    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ---------- 食材 chips ----------
    function renderChips() {
      var box = document.getElementById('chipBox');
      box.innerHTML = '';
      if (!ingredients.length) {
        var tip = document.createElement('span');
        tip.className = 'empty-tip';
        tip.textContent = '还没有食材，先加一个吧～';
        box.appendChild(tip);
        return;
      }
      ingredients.forEach(function(name, idx) {
        var chip = document.createElement('span');
        chip.className = 'chip';

        var label = document.createElement('span');
        label.className = 'chip-name';
        label.textContent = name;

        var x = document.createElement('button');
        x.type = 'button';
        x.className = 'chip-x';
        x.textContent = '×';
        x.setAttribute('aria-label', '删除' + name);
        x.addEventListener('click', function() {
          ingredients.splice(idx, 1);
          renderChips();
        });

        chip.appendChild(label);
        chip.appendChild(x);
        box.appendChild(chip);
      });
    }

    function addIngredients() {
      var input = document.getElementById('ingredientInput');
      // 逗号（中英文）、顿号、分号、空白均可作为分隔符
      var parts = input.value.split(/[,，、;；\s]+/).map(function(s) { return s.trim(); }).filter(Boolean);
      if (!parts.length) {
        showToast('请输入食材名称');
        return;
      }
      var added = 0;
      parts.forEach(function(p) {
        if (ingredients.indexOf(p) === -1) {
          ingredients.push(p);
          added++;
        }
      });
      input.value = '';
      renderChips();
      if (!added) {
        showToast('这些食材已经在列表里啦');
      } else {
        input.focus();
      }
    }

    // ---------- 组装用户消息 ----------
    function buildUserMessage() {
      var prefSelect = document.getElementById('prefSelect');
      var prefLabel = prefSelect.options[prefSelect.selectedIndex].text;
      var taboo = document.getElementById('tabooInput').value.trim();
      var msg = '现有食材：' + ingredients.join('、') + '；口味偏好：' + prefLabel;
      if (taboo) msg += '；忌口：' + taboo;
      return msg;
    }

    // ---------- 流式请求三道菜 ----------
    async function fetchDishes() {
      if (!API_URL) {
        showToast('请先在代码中配置 API_URL');
        return;
      }
      if (!ingredients.length) {
        showToast('先添加至少一种食材哦');
        return;
      }

      var btn = document.getElementById('getBtn');
      var output = document.getElementById('outputText');
      var voiceBtn = document.getElementById('voiceBtn');
      var audioSection = document.getElementById('audioSection');

      btn.disabled = true;
      btn.textContent = '⏳ 正在翻菜谱...';
      voiceBtn.classList.add('hidden');
      audioSection.classList.remove('show');
      output.innerHTML = '<span class="placeholder"><span class="loading-dots">正在看看冰箱里能做啥</span></span>';
      currentDish = '';

      var userMsg = buildUserMessage();

      try {
        var response = await fetch(API_URL, {
          method: 'POST',
          headers: API_HEADER,
          body: JSON.stringify({
            model: GLM_MODEL,
            messages: [
              { role: 'system', content: SYSTEM_PROMPT },
              { role: 'user', content: userMsg }
            ],
            stream: true
          })
        });

        if (!response.ok) throw new Error('API请求失败');

        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';

        while (true) {
          var read = await reader.read();
          if (read.done) break;

          buffer += decoder.decode(read.value, { stream: true });
          var lines = buffer.split('\n');
          buffer = lines.pop();   // 最后一段可能是不完整行，留到下一轮

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (!line.startsWith('data: ')) continue;
            var data = line.slice(6).trim();

            if (data === '[DONE]') {
              finishGeneration(output, voiceBtn);
              return;
            }
            try {
              var json = JSON.parse(data);
              var content = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
              if (content) {
                currentDish += content;
                output.textContent = currentDish;
              }
            } catch (e) {}
          }
        }

        // 流自然结束但未收到 [DONE]
        if (currentDish) {
          finishGeneration(output, voiceBtn);
        } else {
          throw new Error('空响应');
        }
      } catch (error) {
        console.error('Error:', error);
        output.innerHTML = '<span class="placeholder">请求失败，请检查网络后重试</span>';
        showToast('请求失败');
      } finally {
        btn.disabled = false;
        btn.textContent = '🍳 看看做什么';
      }
    }

    function finishGeneration(output, voiceBtn) {
      output.textContent = currentDish || '（这次没想出来，再试一次吧）';
      voiceBtn.classList.remove('hidden');
      showToast('三道菜想好啦 🍳');
      if (window.aiHistory) {
        aiHistory.save('冰箱料理', buildUserMessage(), currentDish, { voice: 'zh-CN-XiaomengNeural', speed: 0.9 });
      }
    }

    // ---------- TTS 朗读（写法同 hypnosis.html） ----------
    function generateVoice() {
      if (!currentDish) {
        showToast('暂无内容可朗读');
        return;
      }
      window.generateVoiceFromContent(currentDish, { voice: 'zh-CN-XiaomengNeural', speed: 0.9 });
    }

    window.generateVoiceFromContent = function(text, params) {
      var voice = (params && params.voice) || 'zh-CN-XiaomengNeural';
      var speed = (params && params.speed) || 0.9;
      var audioEl = document.getElementById('audioEl');
      var audioSection = document.getElementById('audioSection');
      var voiceBtn = document.getElementById('voiceBtn');
      if (!audioEl) return;
      voiceBtn.classList.remove('hidden');
      voiceBtn.disabled = true;
      voiceBtn.textContent = '⏳ 合成中...';
      audioSection.classList.add('show');
      var audioBlobUrl = null;
      (async function() {
        for (const apiUrl of VOICE_API_URLS) {
          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ input: text, voice: voice, speed: speed, pitch: 0 })
            });
            if (res.ok) {
              const blob = await res.blob();
              if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
              audioBlobUrl = URL.createObjectURL(blob);
              currentAudioUrl = audioBlobUrl;
              audioEl.src = audioBlobUrl;
              audioEl.play();
              voiceBtn.disabled = false;
              voiceBtn.textContent = '🔊 重新朗读';
              return;
            }
          } catch (e) { continue; }
        }
        voiceBtn.disabled = false;
        voiceBtn.textContent = '🔊 朗读菜谱';
        showToast('语音生成失败');
      })();
    };

    // ---------- 初始化 ----------
    document.getElementById('ingredientInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addIngredients();
      }
    });
    document.getElementById('tabooInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        fetchDishes();
      }
    });

    renderChips();
  </script>
</body>
</html>
